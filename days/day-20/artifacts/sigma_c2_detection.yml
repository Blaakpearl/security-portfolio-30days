title: C2 Beacon — New/Uncategorized Domain HTTPS Connection
id: e5f6a7b8-c9d0-e1f2-a3b4-c5d6e7f8a9b0
status: stable
description: |
    Detects HTTPS connections to domains registered within the last 30 days
    with low global prevalence. New domains are a strong C2 indicator.
    Combine with connection count threshold to reduce FP rate.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
references:
    - https://attack.mitre.org/techniques/T1071/001/
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    product: zeek
    service: ssl
detection:
    selection:
        domain_age_days|lt: 30
    filter_legit:
        server_name|contains:
            - '.microsoft.com'
            - '.windows.com'
            - '.office.com'
            - '.azure.com'
            - '.novacrest.com'
    timeframe: 10m
    condition: selection and not filter_legit
    | count() by id.orig_h, server_name > 3
fields:
    - ts
    - id.orig_h
    - server_name
    - ja3
    - domain_age_days
falsepositives:
    - New legitimate SaaS services (inform IT before alerting)
    - CDN cache endpoints with short TTL domains
level: high
