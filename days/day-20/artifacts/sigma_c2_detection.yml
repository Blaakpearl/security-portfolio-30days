title: C2 Beacon — Statistical Beacon Timing Pattern (Periodic Connections)
id: b8c9d0e1-f2a3-b4c5-d6e7-f8a9b0c1d2e3
status: experimental
description: |
    Detects statistically periodic connections to the same external IP,
    indicative of C2 beaconing. Uses coefficient of variation (CV) on
    inter-arrival times. Low CV with high connection count = beacon.
    Works even with jitter when standard threshold is applied.
    Requires: Zeek conn.log with timestamps + SIEM aggregation capability.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
references:
    - https://www.cobaltstrike.com/blog/signal-noise-hunting-for-beaconing
    - https://github.com/corelight/zeek-beacon-detection
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.t1001.001
logsource:
    product: zeek
    service: conn
detection:
    # This rule requires SIEM-side aggregation — not simple field matching
    # Implement via Splunk SPL or KQL (see query files)
    # Pseudo-logic:
    #   1. Group connections by (src_ip, dst_ip, dst_port)
    #   2. Calculate IAT (inter-arrival times) between connections
    #   3. Calculate CV of IATs: CV = stddev(IATs) / mean(IATs)
    #   4. Alert if: connection_count > 8 AND CV < 0.35 AND mean_IAT between 30–1800s
    selection:
        proto: 'tcp'
        id.resp_p:
            - 443
            - 80
            - 8080
        id.resp_h|not_startswith:
            - '10.'
            - '172.16.'
            - '192.168.'
    condition: selection
    # Real logic applied in SIEM aggregation — see splunk_c2_detection.spl Query B-5
fields:
    - ts
    - id.orig_h
    - id.resp_h
    - id.resp_p
    - orig_bytes
    - resp_bytes
    - duration
falsepositives:
    - Cloud sync services (Dropbox, OneDrive) with predictable sync intervals
    - Monitoring agents with fixed polling intervals
    - Tune: add allowlist for known-good periodic connection destinations
level: high
