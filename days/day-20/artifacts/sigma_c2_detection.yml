title: C2 Beacon — Self-Signed Certificate on Outbound HTTPS Connection
id: c9d0e1f2-a3b4-c5d6-e7f8-a9b0c1d2e3f4
status: stable
description: |
    Detects outbound HTTPS connections where the server certificate failed
    validation (self-signed, expired, or revoked). Legitimate business
    services use valid CA-signed certificates. Self-signed = C2 infrastructure.
    Best deployed in conjunction with TLS inspection.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
tags:
    - attack.command_and_control
    - attack.t1573.002
logsource:
    product: zeek
    service: ssl
detection:
    selection:
        validation_status:
            - 'self signed certificate'
            - 'self signed certificate in certificate chain'
            - 'unable to get local issuer certificate'
            - 'certificate has expired'
    filter_legit:
        # Internal services with self-signed certs (pre-approved)
        server_name|contains:
            - '.novacrest.internal'
            - '.corp.novacrest.com'
    condition: selection and not filter_legit
fields:
    - ts
    - id.orig_h
    - id.resp_h
    - server_name
    - validation_status
    - ja3
falsepositives:
    - Internal development environments accessed from production
    - Home lab connections (if personal devices on corporate network)
    - Lab testing environments
level: medium
---
title: C2 Beacon — Outbound HTTPS Consistent Payload Pattern
id: d0e1f2a3-b4c5-d6e7-f8a9-b0c1d2e3f4a5
status: experimental
description: |
    Detects connections to the same external IP with unusually consistent
    payload sizes across multiple connections. C2 beacons have predictable
    payload sizes (checkin packet + response). Requires aggregation logic.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    product: zeek
    service: conn
detection:
    # SIEM-side aggregation required (see SPL Query B-4)
    # Alert if: same dst_ip, bytes_cv < 0.20, count > 8
    selection:
        proto: 'tcp'
        id.resp_p: 443
        orig_bytes|gt: 500
        orig_bytes|lt: 50000
    condition: selection
falsepositives:
    - Regular API polling with fixed-size payloads
    - Software update check-in services
level: medium
