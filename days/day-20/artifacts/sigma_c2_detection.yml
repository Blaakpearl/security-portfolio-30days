title: C2 Beacon — Domain Fronting (SNI ≠ Host Header)
id: f6a7b8c9-d0e1-f2a3-b4c5-d6e7f8a9b0c1
status: stable
description: |
    Detects domain fronting where the TLS SNI (outer) differs from the HTTP
    Host header (inner). Domain fronting hides the true C2 destination behind
    a legitimate CDN. Requires TLS inspection (Zscaler, Palo Alto) to detect.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
references:
    - https://attack.mitre.org/techniques/T1090/004/
    - https://www.bitsight.com/blog/domain-fronting-explained
tags:
    - attack.command_and_control
    - attack.t1090.004
    - attack.t1573.002
logsource:
    product: zeek
    service: http
detection:
    selection:
        # After TLS inspection: http.log has both Host and server_name
        # Domain fronting: host (inner) ≠ server_name (SNI, outer)
        'http.virtual_host|not_contains':
            - '%server_name%'
    filter_legit:
        # Some legitimate CDN configurations use different inner/outer
        http.virtual_host|endswith:
            - '.azureedge.net'
            - '.cloudfront.net'
            - '.akamaiedge.net'
        # Only flag if inner Host is NOT a known corporate domain
        http.virtual_host|not_contains:
            - 'novacrest'
            - 'microsoft'
            - 'office'
    condition: selection and not filter_legit
fields:
    - ts
    - id.orig_h
    - id.resp_h
    - server_name
    - http.virtual_host
    - ja3
falsepositives:
    - Misconfigured CDN reverse proxy configurations
    - Legitimate multi-tenant CDN applications
    - Require: TLS inspection must be enabled to populate Host header in http.log
level: critical
