title: C2 Beacon — DNS-over-HTTPS to External Resolver (DoH Bypass)
id: a7b8c9d0-e1f2-a3b4-c5d6-e7f8a9b0c1d2
status: stable
description: |
    Detects DNS-over-HTTPS (DoH) traffic to external resolvers. DoH bypasses
    traditional DNS monitoring and is used by C2 frameworks (Havoc) as a
    fallback channel. Corporate endpoints should only use internal resolvers.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
references:
    - https://attack.mitre.org/techniques/T1071/004/
    - https://attack.mitre.org/techniques/T1008/
tags:
    - attack.command_and_control
    - attack.t1071.004
    - attack.t1008
logsource:
    product: zeek
    service: ssl
detection:
    selection_cloudflare:
        id.resp_h: '1.1.1.1'
        id.resp_p: 443
        server_name|contains: 'cloudflare-dns'
    selection_google:
        id.resp_h: '8.8.8.8'
        id.resp_p: 443
        server_name|contains: 'dns.google'
    selection_quad9:
        id.resp_h: '9.9.9.9'
        id.resp_p: 443
    condition: 1 of selection_*
fields:
    - ts
    - id.orig_h
    - id.resp_h
    - id.resp_p
    - server_name
    - ja3
falsepositives:
    - Browsers with built-in DoH enabled (Chrome, Firefox DoH feature)
    - Authorized DoH client software
    - Recommend: Block DoH to external resolvers at NGFW and monitor for bypass
level: high
