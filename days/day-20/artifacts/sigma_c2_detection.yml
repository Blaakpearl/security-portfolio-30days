title: C2 Beacon — Sliver/Havoc Known JA3 Fingerprint
id: d4e5f6a7-b8c9-d0e1-f2a3-b4c5d6e7f8a9
status: stable
description: |
    Detects known C2 framework JA3 fingerprints in TLS connections.
    Covers Sliver, Havoc, Metasploit, Cobalt Strike, and Brute Ratel.
    High-fidelity — known-bad JA3s have very low false-positive rate.
author: V. Willis, CISSP — NovaCrest Purple Team
date: 2026-06-20
references:
    - https://github.com/BishopFox/sliver
    - https://github.com/HavocFramework/Havoc
    - https://engineering.salesforce.com/tls-fingerprinting-with-ja3-and-ja3s-247362855967
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.t1573.002
logsource:
    product: zeek
    service: ssl
detection:
    selection:
        ja3|contains:
            - 'a0e9f5d64349fb13191bc781f81f42e1'  # Sliver C2
            - 'f4febc55ea12b31ae17cfb7e614afda8'  # Havoc C2
            - '51c64c77e60f3980eea90869b68c58a8'  # Metasploit
            - '6734f37431670b3ab4292b8f60f29984'  # Sliver (alternate)
            - 'c12f54a3f91dc7bafd92cb59fe009a35'  # Brute Ratel
            - 'b386946a5a44d1ddcc843bc75336dfce'  # Nighthawk
    condition: selection
fields:
    - ts
    - id.orig_h
    - id.resp_h
    - server_name
    - ja3
    - jarm
    - validation_status
falsepositives:
    - Security testing tools used by internal red team
    - Authorized penetration testing with pre-disclosed JA3
level: critical
